<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
</head>
<body>

  <header>
    <h1>Student Registration Form</h1>
    <nav>
      <a href="profile.html">Profile</a> |
      <a href="registration.html">Registration</a> |
      <a href="students.html">Student Records</a>
    </nav>
  </header>

  <main>
    <form action="#" method="post">

      <fieldset>
        <legend>Personal Details</legend>

        <p>
          <label for="fname">First Name:</label>
          <input type="text" id="fname" name="fname" placeholder="Enter first name" required>
        </p>
        <p>
          <label for="lname">Last Name:</label>
          <input type="text" id="lname" name="lname" placeholder="Enter last name" required>
        </p>
        <p>
          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob">
        </p>
        <p>
          Gender:
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Female</label>
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">Male</label>
          <input type="radio" id="other" name="gender" value="other">
          <label for="other">Other</label>
        </p>
      </fieldset>

      <fieldset>
        <legend>Contact Details</legend>

        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </p>
        <p>
          <label for="phone">Phone:</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit number">
        </p>
        <p>
          <label for="address">Address:</label><br>
          <textarea id="address" name="address" rows="3" cols="40"></textarea>
        </p>
      </fieldset>

      <fieldset>
        <legend>Course Details</legend>

        <p>
          <label for="course">Course:</label>
          <select id="course" name="course" required>
            <option value="">-- Select --</option>
            <option value="bsc">B.Sc. Computer Science</option>
            <option value="bca">BCA</option>
            <option value="btech">B.Tech</option>
          </select>
        </p>
        <p>
          Interests:
          <input type="checkbox" id="web" name="interest" value="web">
          <label for="web">Web Development</label>
          <input type="checkbox" id="data" name="interest" value="data">
          <label for="data">Data Science</label>
          <input type="checkbox" id="app" name="interest" value="app">
          <label for="app">App Development</label>
        </p>
        <p>
          <label for="photo">Upload Photo:</label>
          <input type="file" id="photo" name="photo" accept="image/*">
        </p>
        <p>
          <input type="checkbox" id="agree" name="agree" required>
          <label for="agree">I confirm the details above are correct.</label>
        </p>
      </fieldset>

      <p>
        <button type="submit">Register</button>
        <button type="reset">Reset</button>
      </p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Prathmesh Panmand</p>
  </footer>

</body>
</html>
