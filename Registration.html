<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <span class="logo">My Portfolio</span>
    <ul>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="registration.html" class="active">Register</a></li>
      <li><a href="profile.html#contact">Contact</a></li>
    </ul>
  </nav>

  <main class="container">
    <form class="form-card" action="#" method="post">
      <h1>Student registration</h1>
      <p class="hint">Fill in your details. Fields marked * are required.</p>

      <div class="form-row">
        <div class="form-group">
          <label for="fname">First name *</label>
          <input type="text" id="fname" name="fname" required>
        </div>
        <div class="form-group">
          <label for="lname">Last name *</label>
          <input type="text" id="lname" name="lname" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dob">Date of birth</label>
          <input type="date" id="dob" name="dob">
        </div>
        <div class="form-group">
          <label for="course">Course *</label>
          <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option>B.Sc. Computer Science</option>
            <option>BCA</option>
            <option>B.Tech</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <span><strong>Gender</strong></span>
        <div class="gender">
          <label><input type="radio" name="gender" value="female"> Female</label>
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="other"> Other</label>
        </div>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3"></textarea>
      </div>

      <button type="submit">Register</button>
    </form>
  </main>

  <footer>&copy; 2026 Prathmesh Panmand</footer>
</body>
</html>
